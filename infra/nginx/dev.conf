# Sarwagya — Nginx reverse proxy (local development)
# In production, Cloudflare sits in front of this (free tier).

server {
    listen 80;
    server_name localhost;

    # Security headers (defense in depth alongside FastAPI middleware)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    client_max_body_size 5M;

    # ── Backend API ──────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ── Health check (no rate limit, used by uptime monitors) ────────────
    location /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # ── Metrics (internal only — block external access) ──────────────────
    location /metrics {
        deny all;
        return 403;
    }

    # ── API docs (disable in production) ──────────────────────────────────
    location /docs {
        proxy_pass http://backend:8000/docs;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
    }
}
